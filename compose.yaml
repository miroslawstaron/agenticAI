services:
  studio:
    image: agenticai-studio:latest
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - studio-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY
      - OLLAMA_API_KEY
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  studio-data:

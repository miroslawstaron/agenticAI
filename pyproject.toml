[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticai-studio"
version = "1.0.0"
description = "Local visual agent networks with autonomous collaboration and CLI tools"
requires-python = ">=3.11"
license-files = []
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "jsonschema>=4.23,<5", "psutil>=6,<8"]

[project.optional-dependencies]
excel = ["pandas>=2.2", "openpyxl>=3.1"]
legacy = ["pandas>=2.2", "openpyxl>=3.1", "tqdm>=4.66"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "build>=1.2", "playwright>=1.49"]
benchmark = ["requests>=2.32", "pandas>=2.2", "openpyxl>=3.1"]

[project.scripts]
agenticai = "agenticai.cli:main"

[project.entry-points."agenticai.tools"]

[tool.setuptools]
packages = ["agenticai"]
py-modules = ["agent", "agentC", "agentCompiler", "agentStaticAnalyzer"]
include-package-data = true

[tool.setuptools.package-data]
agenticai = ["static/**/*", "docs/*", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

